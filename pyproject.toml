[project]
name = "litfactory"
version = "0.1.0"
description = "每日发现、评估并推送有价值的学术文献"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.13",
  "jsonschema>=4.21",
  "pydantic>=2.7",
  "python-ulid>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.30",
  "typer>=0.12",
  "zstandard>=0.22",
]

[project.scripts]
litfactory = "litfactory.cli:main"

[dependency-groups]
dev = [
  "import-linter>=2.0",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-jsonschema",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litfactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: 纯逻辑，无 IO",
  "contracts: 适配器统一契约",
  "integration: 数据库和迁移",
  "e2e: 全流程",
]

[tool.coverage.run]
source = ["litfactory"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "litfactory"

[[tool.importlinter.contracts]]
name = "依赖方向只能向内"
type = "layers"
containers = ["litfactory"]
layers = [
  "cli",
  "bootstrap",
  "adapters | infra",
  "application",
  "ports",
  "domain",
]

[[tool.importlinter.contracts]]
name = "适配器不能访问流程和基础设施"
type = "forbidden"
source_modules = ["litfactory.adapters"]
forbidden_modules = ["litfactory.application", "litfactory.infra"]

[[tool.importlinter.contracts]]
name = "适配器之间互相独立"
type = "independence"
modules = [
  "litfactory.adapters.blobstore",
  "litfactory.adapters.fakes",
  "litfactory.adapters.parsers",
  "litfactory.adapters.renderers",
]
