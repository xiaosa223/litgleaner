# 当前是演示配置：外部依赖都是假适配器，数据写入 data/demo/。
# 接入真实信号源时，把路径和适配器换掉，流程代码不用动。
database: data/demo/litgleaner.db
blob_root: data/demo/blobs
archive_dir: data/demo/archive
prompts_dir: prompts
timezone: Asia/Shanghai
language:
  ui: zh-CN         # 省略时跟随系统；首发支持 zh-CN / en
  reading: zh-CN    # 译文、讲解、卡片等的输出语言；省略时跟随 ui
jobs:
  max_attempts: 3
  backoff_seconds: 300
chunker:
  target_tokens: 800
  max_tokens: 1200
  overlap_sentences: 1
assess:
  token_budget: 6000
map:
  token_budget: 12000
# 综述骨架只整理已读论文的已有提取，先预览确认；限制实际发送给模型的输入量。
outline:
  token_budget: 12000  # 整数 512–64000；改预算标记旧结果过期，不自动重做
# 课题调研先预览、再显式执行；各上限约束本轮候选范围。
survey:
  rounds: 2
  candidate_limit: 100
  category_limit: 30
  expansion_limit: 20
  seed_limit: 5
  since: '1900-01-01'
  coverage_threshold: 0.05
# 数据库快照：serve 每天自动备份，backup 手动生成，db upgrade 迁移前备份，共保留 keep 份。
# 恢复演练：litgleaner restore --check <快照>。
backup:
  dir: data/demo/backups
  keep: 14
# 全文来源按顺序尝试，第一个拿到 PDF 的生效。真实来源默认关闭，启用时改成 enabled: true。
# 顺序建议：自己的库 → 预印本 → 开放获取聚合 → 机构订阅（只有在校园网或 VPN 里运行才有效）。
fulltext:
  - adapter: fake_fulltext
  - { adapter: zotero, enabled: false, optional_env: [ZOTERO_API_KEY] }  # 你 Zotero 里已有的 PDF
  - { adapter: arxiv, enabled: false }
  - { adapter: europe_pmc, enabled: false }         # PubMed Central 开放获取子集
  - { adapter: unpaywall, enabled: false }          # 必须设置 LITGLEANER_CONTACT_EMAIL
  - { adapter: openalex, enabled: false, optional_env: [OPENALEX_API_KEY] }
  - { adapter: semantic_scholar, enabled: false, optional_env: [SEMANTIC_SCHOLAR_API_KEY] }
  - { adapter: core, enabled: false, credentials_env: [CORE_API_KEY] }
  - { adapter: crossref_tdm, enabled: false }       # 出版商登记的文本挖掘链接，订阅文章需机构网络
parser:
  adapter: fake_parser
# 接入真实解析时换成下面的配置（token 由 .env.example 从钥匙串注入）：
# parser:
#   adapter: mineru_cloud
#   credentials_env: [MINERU_API_TOKEN]
#   options:
#     state_dir: data/mineru_state   # 未完成任务的续查记录，避免重复提交
#     model_version: vlm
#     language: ch                   # ch 同时覆盖中英文
#     timeout_seconds: 600
# 不耗额度的备选：adapter: pdf_text（英文论文效果接近，中文期刊明显较差）
# 加入文献库：推送卡片上点“加入 Zotero”或运行 litgleaner zotero add <DOI> 后写进本机 Zotero。
# 需要 Zotero 10 以上并开着；第一次先运行 litgleaner zotero authorize。说明见 docs/CHANNELS.md。
